    <div id="app" role="status">Preparing your learning studio...</div>
    <div id="reading-progress" aria-hidden="true"><div></div></div>
    <button id="studio-nav-backdrop" type="button" aria-label="Close chapter navigation" tabindex="-1" hidden></button>
    <button id="back-to-top" title="Back to top" aria-label="Back to top">↑</button>

    <script>
      // Old Docsify links dropped the docs directory. Redirect only known pages,
      // before Docsify resolves them, so subsequent relative links have context.
      (function () {
        const chapters = [
          "00-FUNDAMENTALS", "00-GUIDED-FUNDAMENTALS",
          "01-GUIDED-REST", "01-REST-APIS",
          "02-GRAPHQL", "02-GUIDED-GRAPHQL", "03-RPC-AND-GRPC", "03-GUIDED-RPC-AND-GRPC",
          "04-REALTIME-COMMUNICATION", "04-GUIDED-REALTIME", "05-ASYNC-APIS", "06-API-ARCHITECTURE",
          "07-SENIOR-DESIGN-GUIDE", "08-EXPERT-API-DESIGN",
          "09-SYSTEM-DESIGN-CASE-STUDIES", "CONTENT-CORRECTIONS", "COURSE-CONTENT-MAP",
        ];
        const lessons = [
          "GRAPHQL-COST-CACHING-AND-EVOLUTION", "GRAPHQL-EXECUTION-AND-BATCHING",
          "REST-AUTH-AND-EVOLUTION", "REST-COLLECTIONS-AND-CACHING",
          "REST-HTTP-CONTRACTS", "REST-RELIABILITY-AND-OPERATIONS",
          "GRPC-PROTOBUF-AND-EVOLUTION", "GRPC-LIFECYCLE-AND-OPERATIONS",
          "REALTIME-RECOVERY-AND-FLOW", "WEBHOOKS-AND-BACKGROUND-JOBS",
          "PUSH-NOTIFICATION-DELIVERY", "WEBRTC-MEDIA-AND-CONNECTIVITY",
        ];
        function canonicalizeLegacyRoute() {
          const href = window.location.href;
          const hashIndex = href.indexOf("#");
          if (hashIndex < 0) return;
          const hash = href.slice(hashIndex);
          const match = hash.match(/^#\/(?:\.\.\/)*(lessons\/)?([A-Z0-9-]+)(?:\.md)?(?=[?#]|$)/);
          if (!match) return;
          const name = match[2];
          const directory = !match[1] && chapters.includes(name) ? "/docs/" :
            lessons.includes(name) ? "/docs/lessons/" : "";
          if (directory) {
            let suffix = hash.slice(match[0].length);
            const anchorIndex = suffix.indexOf("#");
            if (anchorIndex >= 0) {
              const anchor = suffix.slice(anchorIndex + 1).replace(/[&=#?]/g,
                character => "%" + character.charCodeAt(0).toString(16).toUpperCase());
              suffix = suffix.slice(0, anchorIndex) + (anchorIndex ? "&" : "?") + "id=" + anchor;
            }
            window.location.replace(href.slice(0, hashIndex) + "#" + directory + name + suffix);
          }
        }
        canonicalizeLegacyRoute();
        window.addEventListener("hashchange", canonicalizeLegacyRoute);
      })();
    </script>
    <script>
      window.$docsify = {
        name: "Learning path",
        nameLink: "#/",
        repo: "",
        loadSidebar: true,
        relativePath: true,
        subMaxLevel: 3,
        search: {
          placeholder: "Search the course...",
          noData: "No results found",
          depth: 4,
        },
        auto2top: true,
        coverpage: false,
        themeColor: "#7de3ed",
        pagination: {
          previousText: "← Previous",
          nextText: "Next →",
          crossChapter: true,
          crossChapterText: true,
        },
        tabs: {
          persist: true,
          sync: true,
          theme: "material",
        },
        markdown: {
          renderer: {
            link: function (href, title, text) {
              const pathname = href.split(/[?#]/, 1)[0];
              if (!/^(?:[a-z][a-z\d+.-]*:|\/\/|#)/i.test(href) &&
                  /\.[a-z\d]+$/i.test(pathname) && !/\.md$/i.test(pathname)) {
                const page = new URL(window.location.href);
                page.hash = "";
                page.search = "";
                if (/\.html$/i.test(page.pathname)) {
                  page.pathname = page.pathname.slice(0, page.pathname.lastIndexOf("/") + 1);
                } else if (!page.pathname.endsWith("/")) {
                  page.pathname += "/";
                }
                const hash = window.location.href.split("#", 2)[1] || "/";
                const route = hash.split(/[?#]/, 1)[0].replace(/^\//, "");
                const documentUrl = new URL(route, page);
                href = new URL(href.replace(/^\//, ""), href.startsWith("/") ? page : documentUrl).href;
              }
              return this.origin.link.call(this, href, title, text);
            },
            code: function (code, lang) {
              if (lang === "mermaid") {
                return '<div class="mermaid">' + code + "</div>";
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              window.dispatchEvent(new Event("studio:lesson-ready"));
              window.dispatchEvent(new Event("scroll"));
            });
          },
        ],
      };
    </script>

    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        themeVariables: {
          darkMode: true,
          primaryColor: "#172b43",
          primaryTextColor: "#eaf2ff",
          primaryBorderColor: "#7de3ed",
          lineColor: "#a6b7cf",
          secondaryColor: "#17243b",
          tertiaryColor: "#111c30",
          fontFamily: "Inter, sans-serif",
          fontSize: "14px",
        },
      });
    </script>

    <!-- Both Docsify's content scroller and document scrolling are supported. -->
    <script>
      (function () {
        var btn = document.getElementById("back-to-top");
        var progress = document.querySelector("#reading-progress > div");
        function scrollOwner() {
          var content = document.querySelector("section.content");
          if (content && content.scrollHeight > content.clientHeight &&
              /auto|scroll/.test(getComputedStyle(content).overflowY)) {
            return content;
          }
          return document.scrollingElement || document.documentElement;
        }
        function updateReadingPosition() {
          var scrollEl = scrollOwner();
          var distance = scrollEl.scrollHeight - scrollEl.clientHeight;
          var percent = distance > 0 ? Math.min(100, Math.max(0, scrollEl.scrollTop / distance * 100)) : 0;
          progress.style.width = percent + "%";
          btn.classList.toggle("visible", scrollEl.scrollTop > 400);
        }
        window.addEventListener("scroll", updateReadingPosition, { capture: true, passive: true });
        window.addEventListener("resize", updateReadingPosition);
        btn.addEventListener("click", function () {
          scrollOwner().scrollTo({
            top: 0,
            behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          });
        });
      })();
    </script>
  </body>
</html>
